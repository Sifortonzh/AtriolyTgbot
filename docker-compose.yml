version: "3.8"

services:
  atrioly-bot:
    container_name: atrioly_wanatring
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport importlib.util, pathlib, sys\nroot = pathlib.Path('/app')\nchecks = [root / 'src' / 'main.py', root / 'src' / 'config.py']\nmissing = [str(p) for p in checks if not p.exists()]\nif missing:\n    print('Missing:', missing)\n    sys.exit(1)\nprint('ok')\nPY"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  atrioly-dashboard:
    container_name: atrioly_dashboard
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn src.web.app:app --host 0.0.0.0 --port 8787
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5).read()\nprint('ok')\nPY"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
